<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NucleoLab</title>
<style>
:root{--bg:#0c1014;--p:#141b21;--l:#26323b;--t:#d9e4ea;--m:#7f929e;--y:#ffd54a;--c:#4fd1e8;--r:#ff6b6b;--g:#5fdd8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--l);flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.5px}#idn{color:var(--m);font:12px monospace;flex:1}
.led{padding:3px 9px;border-radius:10px;background:#222d35;font-size:12px}.led.ok{background:#17492c;color:var(--g)}.led.bad{background:#4a1d1d;color:var(--r)}.led.rem{background:#4a3a12;color:var(--y)}
main{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:12px}@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:12px;margin-bottom:12px}h2{font-size:12px;margin:0 0 9px;color:var(--m);font-weight:600}
canvas{width:100%;height:440px;display:block;background:#06090b;border-radius:6px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}button{background:#222d35;color:var(--t);border:1px solid var(--l);border-radius:6px;padding:7px 13px;cursor:pointer;font:inherit}button.on{background:var(--c);color:#04222a;font-weight:600}button:disabled{opacity:.4}
label{display:grid;grid-template-columns:105px 1fr;align-items:center;margin:6px 0;color:var(--m)}input,select{background:#0a0e11;color:var(--t);border:1px solid var(--l);border-radius:5px;padding:6px;font:inherit;width:100%}
#meas{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:10px}#meas div{background:#0a0e11;border-radius:6px;padding:7px 10px}#meas b{display:block;font:600 17px monospace;color:var(--y)}#meas span{font-size:11px;color:var(--m)}
#log{height:150px;overflow:auto;font:12px monospace;background:#06090b;border-radius:6px;padding:8px;white-space:pre-wrap;margin-bottom:7px}#log .e{color:var(--r)}#log .q{color:var(--c)}
</style>
<header><h1>NucleoLab</h1><span id="idn">bağlanıyor…</span><span id="fps" class="led">–</span><span id="trg" class="led">–</span><span id="con" class="led bad">KOPUK</span></header>
<main><section><div class="card"><div class="tabs"><button data-m="scope" class="on">Osiloskop</button><button data-m="spec">Spektrum</button><button data-m="bode">Bode</button><span style="flex:1"></span><button id="run">Durdur</button><button id="csv">CSV indir</button></div>
<canvas id="cv"></canvas><div id="meas"></div></div>
<div class="card"><h2>SCPI konsolu</h2><div id="log"></div><input id="cmd" placeholder="*IDN?   (Enter ile gönder, ↑ geçmiş)" autocomplete="off"></div></section>
<aside><div class="card"><h2>Sinyal jeneratörü</h2>
<label>Dalga<select id="fn"><option value="SIN">Sinüs</option><option value="SQU">Kare</option><option value="TRI">Üçgen</option><option value="RAMP">Testere</option><option value="DC">DC</option></select></label>
<label>Frekans (Hz)<input id="fr" type="number" min="1" max="100000"></label><label>Genlik (Vpp)<input id="am" type="number" step=".1"></label><label>Ofset (V)<input id="of" type="number" step=".05"></label><label>Doluluk (%)<input id="du" type="number" min="1" max="99"></label><button id="out" style="width:100%">Çıkış</button></div>
<div class="card"><h2>Osiloskop</h2><label>Kanal<select id="ch"><option value="1">1: PA0 (A0)</option><option value="2">2: PA1 (A1)</option><option value="3">3: PA4 dahili</option></select></label>
<label>Örnekleme<select id="sr"><option value="1000">1 kS/s</option><option value="10000">10 kS/s</option><option value="50000">50 kS/s</option><option value="100000">100 kS/s</option><option value="250000">250 kS/s</option><option value="500000">500 kS/s</option><option value="1000000">1 MS/s</option></select></label>
<label>Nokta<select id="po"><option>512</option><option>1024</option><option>2048</option><option>4096</option><option>8192</option></select></label>
<label>Tetik (V)<input id="lv" type="number" step=".05"></label><label>Kenar<select id="sl"><option value="POS">Yükselen</option><option value="NEG">Düşen</option></select></label></div>
<div class="card"><h2>Bode</h2><label>Başlangıç (Hz)<input id="b0" type="number" value="20"></label><label>Bitiş (Hz)<input id="b1" type="number" value="50000"></label><label>Nokta<input id="bn" type="number" value="50"></label><label>R (Ω)<input id="R" type="number" value="10000"></label><label>C (nF)<input id="C" type="number" value="10"></label><button id="bgo" style="width:100%">Taramayı başlat</button></div></aside></main>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d');let ws,mode='scope',run=true,fr=null,bode=[],sweeping=false,id=0,wait={},times=[],outOn=false,hist=[],hp=0;
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
const scpi=line=>new Promise((ok,no)=>{if(!ws||ws.readyState!==1)return no(Error('bağlantı yok'));const k=++id;wait[k]={ok,no};send({id:k,line})});
function log(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.className=c;$('log').append(d);while($('log').childNodes.length>300)$('log').firstChild.remove();$('log').scrollTop=1e9}
async function cmd(line,show=true){if(show)log('> '+line,'q');try{const r=await scpi(line);if(show&&r.text)log(r.text);r.errors.forEach(e=>log(e,'e'));return r}catch(e){log(e.message,'e');return{text:'',errors:[e.message]}}}
function connect(){ws=new WebSocket(`ws://${location.host}/ws`);ws.onopen=async()=>{led('BAĞLI','ok');await sync();send({run,mode})};
ws.onclose=()=>{led('KOPUK','bad');for(const k in wait){wait[k].no(Error('bağlantı koptu'))}wait={};setTimeout(connect,1500)};
ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='reply'){const w=wait[d.id];delete wait[d.id];w&&w.ok(d)}else if(d.type==='remote')led(d.on?'UZAKTAN KONTROL':'BAĞLI',d.on?'rem':'ok');else if(d.type==='error')log(d.text,'e');else if(d.type==='frame'&&mode!=='bode'){fr=d;const n=performance.now();times.push(n);times=times.filter(t=>n-t<1000);$('fps').textContent=times.length+' kare/s';$('trg').textContent=d.trig?'TETİKLENDİ':'OTO';$('trg').className='led '+(d.trig?'ok':'');draw()}}}
function led(t,c){$('con').textContent=t;$('con').className='led '+c}
async function sync(){const q=async(l)=>(await cmd(l,false)).text;$('idn').textContent=await q('*IDN?');const a=(await q('SOUR:FUNC?;FREQ?;VOLT?;:SOUR:VOLT:OFFS?;:SOUR:FUNC:DCYC?;:OUTP?;:ACQ:CHAN?;SRAT?;POIN?;:TRIG:LEV?;SLOP?')).split(';');if(a.length<11)return;
$('fn').value=a[0];$('fr').value=+(+a[1]).toFixed(2);$('am').value=+a[2];$('of').value=+a[3];$('du').value=+a[4];setOut(a[5]==='1');$('ch').value=a[6];$('sr').value=String(Math.round(+a[7]));$('po').value=a[8];$('lv').value=+a[9];$('sl').value=a[10]}
function setOut(v){outOn=v;$('out').textContent=v?'Çıkış AÇIK':'Çıkış KAPALI';$('out').className=v?'on':''}
const bind=(i,f)=>$(i).onchange=async()=>{const r=await cmd(f($(i).value));if(r.errors.length)sync()};
bind('fn',v=>'SOUR:FUNC '+v);bind('fr',v=>'SOUR:FREQ '+v);bind('am',v=>'SOUR:VOLT '+v);bind('of',v=>'SOUR:VOLT:OFFS '+v);bind('du',v=>'SOUR:FUNC:DCYC '+v);bind('ch',v=>'ACQ:CHAN '+v);bind('sr',v=>'ACQ:SRAT '+v);bind('po',v=>'ACQ:POIN '+v);bind('lv',v=>'TRIG:LEV '+v);bind('sl',v=>'TRIG:SLOP '+v);
$('out').onclick=async()=>{const v=!outOn,r=await cmd('OUTP '+(v?'ON':'OFF'));if(!r.errors.length)setOut(v)};
$('run').onclick=()=>{run=!run;$('run').textContent=run?'Durdur':'Çalıştır';send({run:run&&mode!=='bode'})};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
let saved=null;async function setMode(m){if(sweeping&&m!=='bode')return;if(m==='spec'&&mode!=='spec'){saved=[$('sr').value,$('po').value];const f=+$('fr').value;await cmd(`ACQ:SRAT ${f<2000?100000:f<10000?500000:1000000};POIN 4096`,false);sync()}else if(m!=='spec'&&mode==='spec'&&saved){await cmd(`ACQ:SRAT ${saved[0]};POIN ${saved[1]}`,false);sync()}mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));if(m==='bode')$('fps').textContent='–';fr=null;send({mode:m==='spec'?'spec':'scope',run:run&&m!=='bode'});draw()}
$('cmd').onkeydown=async e=>{if(e.key==='Enter'&&$('cmd').value.trim()){const l=$('cmd').value;hist.push(l);hp=hist.length;$('cmd').value='';await cmd(l);if(!l.includes('?'))sync()}else if(e.key==='ArrowUp'&&hp>0){$('cmd').value=hist[--hp]}else if(e.key==='ArrowDown'){hp=Math.min(hist.length,hp+1);$('cmd').value=hist[hp]||''}};
$('bgo').onclick=async()=>{if(sweeping){sweeping=false;return}const a=+$('b0').value,b=+$('b1').value,n=Math.round(+$('bn').value);if(!(a>=10&&b<=1e5&&a<b&&n>=2&&n<=500)){log('Bode: 10 ≤ başlangıç < bitiş ≤ 100000 ve 2–500 nokta olmalı','e');return}
await setMode('bode');sweeping=true;bode=[];$('bgo').textContent='Durdur';const ch=$('ch').value;log(`Bode taraması, kanal ${ch}`,'q');
for(let i=0;i<n&&sweeping;i++){const r=await cmd(`BODE:POIN? ${(a*Math.pow(b/a,i/(n-1))).toFixed(3)},${ch}`,false);if(!r.text)break;bode.push(r.text.split(',').map(Number));draw()}sweeping=false;$('bgo').textContent='Taramayı başlat'};
$('csv').onclick=()=>{let s;if(mode==='bode')s='Hz,dB,derece,referans_Vpp\n'+bode.map(r=>r.join(',')).join('\n');else if(fr&&mode==='spec'&&fr.spec)s='Hz,dBV\n'+fr.spec.map((v,i)=>i*fr.dist[1]+','+v/100).join('\n');else if(fr)s='s,V\n'+fr.y.map((v,i)=>(i-fr.pre)*fr.dt+','+v*fr.lsb).join('\n');else return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download='nucleolab_'+mode+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const db=v=>Math.abs(v)<1e37?v.toFixed(1)+' dB':'–';
const eng=(v,u)=>{if(!isFinite(v)||Math.abs(v)>1e37)return'–';const a=Math.abs(v),p=a>=1e6?[1e6,'M']:a>=1e3?[1e3,'k']:a>=1||a===0?[1,'']:a>=1e-3?[1e-3,'m']:[1e-6,'µ'];return(v/p[0]).toPrecision(4)+' '+p[1]+u};
function tiles(o){$('meas').replaceChildren(...Object.entries(o).map(([k,v])=>{const d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');b.textContent=v;s.textContent=k;d.append(b,s);return d}))}
let W,H;function prep(){const r=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;g.setTransform(r,0,0,r,0,0);g.font='11px monospace'}
function plot(x0,y0,w,h,xs,ys,xr,yr,col,xl,yl,nx,ny,logx,dash){const X=v=>x0+w*(logx?Math.log(v/xr[0])/Math.log(xr[1]/xr[0]):(v-xr[0])/(xr[1]-xr[0])),Y=v=>y0+h*(1-(v-yr[0])/(yr[1]-yr[0]));
if(xl){g.strokeStyle='#1d2a32';g.fillStyle='#7f929e';g.lineWidth=1;g.beginPath();const tx=[];if(logx){for(let d=Math.ceil(Math.log10(xr[0])-1e-9);d<=Math.log10(xr[1])+1e-9;d++)tx.push(10**d)}else for(let i=0;i<=nx;i++)tx.push(xr[0]+(xr[1]-xr[0])*i/nx);tx.forEach(v=>{g.moveTo(X(v),y0);g.lineTo(X(v),y0+h);g.textAlign='center';g.fillText(xl(v),X(v),y0+h+15)});for(let i=0;i<=ny;i++){const v=yr[0]+(yr[1]-yr[0])*i/ny;g.moveTo(x0,Y(v));g.lineTo(x0+w,Y(v));g.textAlign='right';g.fillText(yl(v),x0-6,Y(v)+4)}g.stroke()}
g.save();g.beginPath();g.rect(x0,y0,w,h);g.clip();g.strokeStyle=col;g.lineWidth=dash?1.2:1.8;g.setLineDash(dash?[5,5]:[]);g.beginPath();xs.forEach((v,i)=>i?g.lineTo(X(v),Y(ys[i])):g.moveTo(X(v),Y(ys[i])));g.stroke();g.restore();return{X,Y}}
function draw(){prep();const x0=58,y0=14,w=W-x0-18,h=H-44;g.fillStyle='#7f929e';
if(mode==='bode'){const hh=(H-76)/2,a=bode.length?Math.min(+$('b0').value,bode[0][0]):20,b=+$('b1').value||5e4,fx=bode.map(r=>r[0]),fc=1/(2*Math.PI*$('R').value*$('C').value*1e-9),tx=[];for(let i=0;i<=200;i++)tx.push(a*Math.pow(b/a,i/200));const lo=Math.min(-40,Math.floor(Math.min(0,...bode.map(r=>r[1]))/10)*10),fl=v=>v>=1000?v/1000+'k':v+'';
plot(x0,y0,w,hh,tx,tx.map(f=>-10*Math.log10(1+(f/fc)**2)),[a,b],[lo,10],'#7f929e',fl,v=>v.toFixed(0)+'dB',0,5,true,true);plot(x0,y0,w,hh,fx,bode.map(r=>r[1]),[a,b],[lo,10],'#ffd54a',null,null,0,0,true);
const y2=y0+hh+32;plot(x0,y2,w,hh,tx,tx.map(f=>-Math.atan(f/fc)*180/Math.PI),[a,b],[-180,180],'#7f929e',fl,v=>v.toFixed(0)+'°',0,4,true,true);plot(x0,y2,w,hh,fx,bode.map(r=>r[2]),[a,b],[-180,180],'#4fd1e8',null,null,0,0,true);
let f3=NaN;const pass=bode.length?bode[0][1]:0;if(pass>-3)for(let i=1;i<bode.length;i++)if(bode[i-1][1]-pass>-3.0103&&bode[i][1]-pass<=-3.0103){const p=bode[i-1],q=bode[i],t=(-3.0103-(p[1]-pass))/(q[1]-p[1]);f3=p[0]*Math.pow(q[0]/p[0],t);break}
tiles({'Ölçülen -3 dB':eng(f3,'Hz'),'Teorik fc (R, C)':eng(fc,'Hz'),'Fark':isFinite(f3)?((f3/fc-1)*100).toFixed(1)+' %':'–','Nokta':bode.length,'Referans':bode.length?eng(bode.at(-1)[3],'Vpp'):'–'});return}
if(!fr)return;
if(mode==='spec'&&fr.spec){const d=fr.dist,xs=fr.spec.map((_,i)=>i*d[1]);plot(x0,y0,w,h,xs,fr.spec.map(v=>v/100),[0,xs.at(-1)],[-120,10],'#4fd1e8',v=>eng(v,'Hz'),v=>v.toFixed(0)+' dBV',5,5);tiles({'Temel frekans':eng(d[2],'Hz'),'Seviye':eng(d[3],'Vrms'),THD:db(d[4]),SNR:db(d[5]),SINAD:db(d[6]),'Bin':eng(d[1],'Hz')});return}
const y=fr.y.map(v=>v*fr.lsb),n=y.length,xs=y.map((_,i)=>(i-fr.pre)*fr.dt),p=plot(x0,y0,w,h,xs,y,[xs[0],xs[n-1]],[0,3.5],'#ffd54a',v=>eng(Math.abs(v)<1e-9?0:v,'s'),v=>v.toFixed(1)+' V',6,7);
g.strokeStyle='#ff6b6b88';g.setLineDash([4,4]);g.beginPath();g.moveTo(x0,p.Y(+$('lv').value));g.lineTo(x0+w,p.Y(+$('lv').value));g.stroke();g.setLineDash([]);
let lo=Math.min(...y),hi=Math.max(...y),m=y.reduce((a,b)=>a+b)/n,ac=Math.sqrt(y.reduce((a,b)=>a+(b-m)**2,0)/n),mid=(lo+hi)/2,hy=(hi-lo)*.1,arm=false,c=NaN,cr=[];for(let i=1;i<n;i++){if(y[i]<mid-hy){arm=true;c=NaN}if(arm&&isNaN(c)&&y[i-1]<mid&&y[i]>=mid)c=i-1+(mid-y[i-1])/(y[i]-y[i-1]);if(arm&&!isNaN(c)&&y[i]>mid+hy){cr.push(c);arm=false;c=NaN}}
const f=cr.length>1&&hi-lo>.03?(cr.length-1)/((cr.at(-1)-cr[0])*fr.dt):NaN;tiles({Frekans:eng(f,'Hz'),'Tepe-tepe':eng(hi-lo,'V'),'AC RMS':eng(ac,'V'),Ortalama:eng(m,'V'),Min:eng(lo,'V'),Maks:eng(hi,'V')})}
addEventListener('resize',draw);connect();
</script></html>
