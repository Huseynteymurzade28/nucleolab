name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ODIN_RELEASE: dev-2026-10
  ZIG_VERSION: 0.17.1

jobs:
  parser:
    name: SCPI parser tests + fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  firmware:
    name: Firmware (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: nucleolab-firmware
          path: build/nucleolab.bin

  tui:
    name: TUIs (Odin + hnoss)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - run: make tui
      - run: cd prototype/pot-adc/tui && odin build . -vet -strict-style -out:pot-tui

  zig:
    name: Zig prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: cd prototype/pot-adc && zig build
