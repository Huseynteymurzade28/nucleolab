<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NucleoLab</title>
<style>
:root{--bg:#0b0e0f;--p:#141819;--p2:#0f1213;--l:#2a3132;--t:#e3e8e6;--m:#8d9a98;--y:#ffd75e;--c:#58d7c9;--r:#ff7a6b;--g:#7fdc8a;--o:#ff9f4a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.35 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{background:#1e2425;border:1px solid var(--l);border-radius:6px;padding:6px 12px;cursor:pointer}button:hover{border-color:#4c5a5a}button.on{background:var(--c);border-color:var(--c);color:#06231f;font-weight:600}
:focus-visible{outline:2px solid var(--c);outline-offset:1px}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--l);background:var(--p)}h1{font-size:17px;margin:0}#idn{color:var(--m);font:12px ui-monospace,monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led{padding:2px 9px;border-radius:4px;background:#1e2425;font:12px ui-monospace,monospace;white-space:nowrap}.ok{color:var(--g)}.bad{color:var(--r)}.rem{color:var(--o)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 270px}
#left{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px;gap:8px}
.bar{display:flex;gap:6px;flex-wrap:wrap}.sp{flex:1}
#scr{flex:1;min-height:180px;position:relative;border:1px solid var(--l);border-radius:8px;overflow:hidden;background:#050807}#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#meas{display:flex;background:var(--p2);border:1px solid var(--l);border-radius:8px;overflow:hidden}#meas div{flex:1;padding:6px 12px;border-right:1px solid var(--l);min-width:0}#meas div:last-child{border:0}#meas b{display:block;font:600 17px ui-monospace,monospace;color:var(--y);white-space:nowrap}#meas span{font-size:11px;color:var(--m)}
#con2{position:relative}#log{height:92px;overflow:auto;font:12px ui-monospace,monospace;background:var(--p2);border:1px solid var(--l);border-radius:8px 8px 0 0;padding:6px 10px;white-space:pre-wrap;overflow-wrap:anywhere}#log .e{color:var(--r)}#log .q{color:var(--c)}
#cmd{width:100%;background:#050807;border:1px solid var(--l);border-top:0;border-radius:0 0 8px 8px;padding:7px 10px;font:13px ui-monospace,monospace}
#sug{position:absolute;bottom:38px;left:0;min-width:340px;max-height:220px;overflow:auto;background:#1b2122;border:1px solid #4c5a5a;border-radius:6px;font:12px ui-monospace,monospace;z-index:5}#sug div{padding:4px 10px;cursor:pointer;display:flex;gap:16px;justify-content:space-between}#sug small{color:var(--m)}#sug .s{background:#2c4643}
aside{overflow:auto;border-left:1px solid var(--l);background:var(--p);padding:12px}aside section{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--l)}aside section:last-child{border:0}h2{font-size:13px;margin:0 0 8px;font-weight:600}
label{display:grid;grid-template-columns:105px 1fr;align-items:center;margin:5px 0;color:var(--m)}aside input,aside select{background:#0a0d0e;color:var(--t);border:1px solid var(--l);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
#waves{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}#waves button{padding:5px 2px;font-size:11px}#waves svg{display:block;margin:0 auto 2px;width:40px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.w{width:100%;margin-top:5px}
dialog{background:var(--p);color:var(--t);border:1px solid #4c5a5a;border-radius:10px;padding:16px;width:min(780px,94vw)}dialog::backdrop{background:#000a}#dc{width:100%;height:300px;background:#050807;border-radius:6px;cursor:crosshair;touch-action:none;display:block;margin:10px 0}dialog p{margin:4px 0;color:var(--m)}
@media(max-width:800px){body{overflow:auto;height:auto}main{display:block}#scr{height:340px;flex:none}aside{border-left:0}#meas{flex-wrap:wrap}#meas div{flex:1 0 30%}#idn{display:none}header{flex-wrap:wrap}}
</style></head><body>
<header><h1>NucleoLab</h1><span id="idn">connecting…</span><span id="fps" class="led">–</span><span id="trg" class="led">–</span><span id="con" class="led bad">OFFLINE</span></header>
<main><div id="left">
<div class="bar"><button data-m="scope" class="on">Scope</button><button data-m="spec">Spectrum</button><button data-m="bode">Bode</button><span class="sp"></span><button id="pers" class="on" title="Old traces fade out">Persist</button><button id="curs" title="Draggable measurement lines">Cursors</button><button id="zr" title="Reset zoom (double-click)">Fit</button><button id="run" title="Space bar">Stop</button><button id="csv">CSV</button><button id="full">Fullscreen</button></div>
<div id="scr"><canvas id="cv" aria-label="Measurement screen"></canvas></div><div id="meas"></div>
<div id="con2"><div id="log"></div><div id="sug" hidden></div><input id="cmd" placeholder="SCPI command: start typing, Tab completes, Enter sends" autocomplete="off" spellcheck="false" aria-label="SCPI command"></div>
</div><aside>
<section><h2>Signal generator</h2><div id="waves"></div><button id="dr" class="w" style="margin:0 0 8px">Draw a waveform</button>
<label>Frequency (Hz)<input id="fr" type="number" min="1" max="100000"></label><label>Amplitude (Vpp)<input id="am" type="number" step=".1"></label><label>Offset (V)<input id="of" type="number" step=".05"></label><label>Duty (%)<input id="du" type="number" min="1" max="99"></label><button id="out" class="w">Output</button></section>
<section><h2>Scope</h2><label>Channel<select id="ch"><option value="1">1: PA0 (A0)</option><option value="2">2: PA1 (A1)</option><option value="3">3: PA4 internal</option></select></label>
<label>Sample rate<select id="sr"><option value="1000">1 kS/s</option><option value="10000">10 kS/s</option><option value="50000">50 kS/s</option><option value="100000">100 kS/s</option><option value="250000">250 kS/s</option><option value="500000">500 kS/s</option><option value="1000000">1 MS/s</option></select></label>
<label>Points<select id="po"><option>512</option><option>1024</option><option>2048</option><option>4096</option><option>8192</option></select></label><label>Trigger (V)<input id="lv" type="number" step=".05"></label><label>Edge<select id="sl"><option value="POS">Rising</option><option value="NEG">Falling</option></select></label></section>
<section><h2>Bode</h2><label>Start (Hz)<input id="b0" type="number" value="20"></label><label>Stop (Hz)<input id="b1" type="number" value="50000"></label><label>Points<input id="bn" type="number" value="50"></label><label>R (Ω)<input id="R" type="number" value="10000"></label><label>C (nF)<input id="C" type="number" value="10"></label><button id="bgo" class="w">Start sweep</button></section>
</aside></main>
<dialog id="dlg"><h2>Draw a waveform</h2><p>Draw one period with the mouse. The board plays it at the selected frequency.</p><canvas id="dc" aria-label="Waveform drawing area"></canvas><div class="bar"><button data-p="ecg">Heartbeat</button><button data-p="stair">Staircase</button><button data-p="sinc">Sinc</button><button data-p="flat">Clear</button><button id="smooth">Smooth</button><span class="sp"></span><button id="dx">Close</button><button id="dgo" class="on">Send to board</button></div></dialog>
<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d');
let ws,mode='scope',run=true,fr=null,bode=[],sweeping=false,id=0,wait={},times=[],outOn=false,fn='SIN',hist=[],hp=0,saved=null,persOn=true,cursOn=false,mouse=null,drag=null,cmds=[],lvl=1.65;
const view={scope:[0,1],spec:[0,1]};let cur=null,busyLv=false;
/* ---- connection ---- */
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
const ask=o=>new Promise((ok,no)=>{if(!ws||ws.readyState!==1)return no(Error('not connected'));const k=++id;wait[k]={ok,no};send({id:k,...o})});
function log(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.className=c;$('log').append(d);while($('log').childNodes.length>300)$('log').firstChild.remove();$('log').scrollTop=1e9}
async function cmd(line,show=true){if(show)log('> '+line,'q');try{const r=await ask({line});if(show&&r.text)log(r.text);r.errors.forEach(e=>log(e,'e'));return r}catch(e){log(e.message,'e');return{text:'',errors:[e.message]}}}
function led(t,c){$('con').textContent=t;$('con').className='led '+c}
function connect(){ws=new WebSocket(`ws://${location.host}/ws`);
ws.onopen=async()=>{led('CONNECTED','ok');await sync();send({run:run&&mode!=='bode',mode:mode==='spec'?'spec':'scope'});if(!cmds.length)loadCmds()};
ws.onclose=()=>{led('OFFLINE','bad');const w=wait;wait={};for(const k in w)w[k].no(Error('connection lost'));setTimeout(connect,1500)};
ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='reply'){const w=wait[d.id];delete wait[d.id];w&&w.ok(d)}else if(d.type==='remote')led(d.on?'REMOTE CONTROL':'CONNECTED',d.on?'rem':'ok');else if(d.type==='error')log(d.text,'e');else if(d.type==='frame'&&mode!=='bode'&&(mode!=='spec'||d.spec)){fr=d;d.v=d.y.map(c=>c*d.lsb);const n=performance.now();times.push(n);times=times.filter(t=>n-t<1000);$('fps').textContent=times.length+' frames/s';$('trg').textContent=d.trig?'TRIGGERED':'AUTO';$('trg').className='led '+(d.trig?'ok':'');fresh=true;render()}}}
async function sync(){$('idn').textContent=(await cmd('*IDN?',false)).text;const a=(await cmd('SOUR:FUNC?;FREQ?;VOLT?;:SOUR:VOLT:OFFS?;:SOUR:FUNC:DCYC?;:OUTP?;:ACQ:CHAN?;SRAT?;POIN?;:TRIG:LEV?;SLOP?',false)).text.split(';');if(a.length<11)return;
fn=a[0];waves();const set=(i,v)=>{if(document.activeElement!==$(i))$(i).value=v};set('fr',+(+a[1]).toFixed(2));set('am',+a[2]);set('of',+a[3]);set('du',+a[4]);setOut(a[5]==='1');set('ch',a[6]);set('sr',String(Math.round(+a[7])));set('po',a[8]);lvl=+a[9];set('lv',lvl);set('sl',a[10])}
function setOut(v){outOn=v;$('out').textContent=v?'Output ON':'Output OFF';$('out').classList.toggle('on',v)}
/* ---- controls ---- */
const W=[['SIN','Sine','M2 10C8 -.5 14 -.5 20 10S32 20.5 38 10'],['SQU','Square','M2 17V3H20V17H38V3'],['TRI','Triangle','M2 10L11 3L29 17L38 10'],['RAMP','Ramp','M2 17L20 3V17L38 3V17'],['DC','DC','M2 10H38'],['ARB','Drawn','M2 12L9 12L13 8L17 14L21 2L25 18L28 12H38']];
function waves(){$('waves').replaceChildren(...W.map(([k,n,p])=>{const b=document.createElement('button');b.className=k===fn?'on':'';b.innerHTML=`<svg viewBox="0 0 40 20"><path d="${p}"/></svg>`;b.append(n);b.onclick=async()=>{if(k==='ARB'&&(await cmd('SOUR:DATA:ARB:POIN?',false)).text==='0')return openDraw();const r=await cmd('SOUR:FUNC '+k);if(!r.errors.length){fn=k;waves();clearPers()}};return b}))}
const bind=(i,f)=>$(i).onchange=async()=>{const r=await cmd(f($(i).value));if(i==='fr'&&mode==='spec')await specSetup();if(i==='lv')lvl=+$(i).value;if(r.errors.length)sync();clearPers()};
bind('fr',v=>'SOUR:FREQ '+v);bind('am',v=>'SOUR:VOLT '+v);bind('of',v=>'SOUR:VOLT:OFFS '+v);bind('du',v=>'SOUR:FUNC:DCYC '+v);bind('ch',v=>'ACQ:CHAN '+v);bind('sr',v=>'ACQ:SRAT '+v);bind('po',v=>'ACQ:POIN '+v);bind('lv',v=>'TRIG:LEV '+v);bind('sl',v=>'TRIG:SLOP '+v);
$('out').onclick=async()=>{const v=!outOn,r=await cmd('OUTP '+(v?'ON':'OFF'));if(!r.errors.length)setOut(v)};
$('run').onclick=()=>{run=!run;$('run').textContent=run?'Stop':'Run';send({run:run&&mode!=='bode'})};
$('pers').onclick=()=>{persOn=!persOn;$('pers').classList.toggle('on',persOn);clearPers();render()};
$('curs').onclick=()=>{cursOn=!cursOn;$('curs').classList.toggle('on',cursOn);cur=null;render()};
$('zr').onclick=()=>{if(view[mode])view[mode]=[0,1];clearPers();render()};
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(e.code==='Space'&&!$('dlg').open&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();$('run').click()}});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
async function specSetup(){const f=+$('fr').value;await cmd(`ACQ:SRAT ${f<2000?100000:f<10000?500000:1000000};POIN 4096`,false);await sync()}
async function setMode(m){if(m===mode||sweeping&&m!=='bode')return;const old=mode;mode=m;fr=null;cur=null;clearPers();document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));send({run:false});
if(m==='spec'){saved=[$('sr').value,$('po').value];await specSetup()}else if(old==='spec'&&saved){await cmd(`ACQ:SRAT ${saved[0]};POIN ${saved[1]}`,false);await sync()}
if(mode!==m)return;if(m==='bode')$('fps').textContent='–';send({mode:m==='spec'?'spec':'scope',run:run&&m!=='bode'});render()}
$('bgo').onclick=async()=>{if(sweeping){sweeping=false;return}const a=+$('b0').value,b=+$('b1').value,n=Math.round(+$('bn').value);if(!(a>=10&&b<=1e5&&a<b&&n>=2&&n<=500)){log('Bode: needs 10 ≤ start < stop ≤ 100000 and 2–500 points','e');return}
await setMode('bode');sweeping=true;bode=[];$('bgo').textContent='Stop';const ch=$('ch').value;log(`Bode sweep, channel ${ch}`,'q');for(let i=0;i<n&&sweeping;i++){const r=await cmd(`BODE:POIN? ${(a*Math.pow(b/a,i/(n-1))).toFixed(3)},${ch}`,false);if(!r.text)break;bode.push(r.text.split(',').map(Number));render()}sweeping=false;$('bgo').textContent='Start sweep'};
$('csv').onclick=()=>{let s;if(mode==='bode')s='Hz,dB,degrees,reference_Vpp\n'+bode.map(r=>r.join(',')).join('\n');else if(fr&&mode==='spec')s='Hz,dBV\n'+fr.spec.map((v,i)=>i*fr.dist[1]+','+v/100).join('\n');else if(fr)s='s,V\n'+fr.v.map((v,i)=>(i-fr.pre)*fr.dt+','+v).join('\n');else return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download='nucleolab_'+mode+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
/* ---- console with completion ---- */
async function loadCmds(){const t=(await cmd('SYST:HELP:HEAD?',false)).text;cmds=t.replace(/^#\d/,'').replace(/^\d+?(?=\*)/,'').split('\n').filter(Boolean).map(p=>{const full=p.replace(/[\[\]]/g,''),sh=p.replace(/\[[^\]]*\]/g,'').replace(/[a-z]/g,'');return{full,sh}})}
let sg=[],si=-1;
function tail(){const v=$('cmd').value,i=v.lastIndexOf(';')+1;let h=v.slice(0,i),t=v.slice(i);const m=t.match(/^\s*:?/)[0];return[h+m,t.slice(m.length)]}
function suggest(){const[,t]=tail(),u=t.toUpperCase();sg=u&&!/\s/.test(t)?cmds.filter(c=>c.sh.startsWith(u)||c.full.toUpperCase().startsWith(u)).slice(0,40):[];if(sg.length===1&&sg[0].sh===u)sg=[];si=-1;showS()}
function showS(){$('sug').hidden=!sg.length;$('sug').replaceChildren(...sg.map((c,i)=>{const d=document.createElement('div'),s=document.createElement('small');d.className=i===si?'s':'';d.append(c.sh,s);s.textContent=c.full;d.onmousedown=e=>{e.preventDefault();take(i)};return d}));if(si>=0)$('sug').children[si].scrollIntoView({block:'nearest'})}
function take(i){const[h]=tail();$('cmd').value=h+sg[i].sh+(sg[i].sh.endsWith('?')?'':' ');sg=[];showS();$('cmd').focus()}
$('cmd').oninput=suggest;$('cmd').onblur=()=>{sg=[];showS()};
$('cmd').onkeydown=async e=>{const K=e.key;if(K==='Tab'&&sg.length){e.preventDefault();take(Math.max(0,si))}else if(K==='Escape'){sg=[];showS()}else if(K==='ArrowDown'||K==='ArrowUp'){e.preventDefault();const d=K==='ArrowDown'?1:-1;if(sg.length){si=(si+d+sg.length)%sg.length;showS()}else{hp=Math.max(0,Math.min(hist.length,hp+d));$('cmd').value=hist[hp]||''}}
else if(K==='Enter'){if(si>=0)return take(si);const l=$('cmd').value.trim();if(!l)return;hist.push(l);hp=hist.length;$('cmd').value='';sg=[];showS();await cmd(l);if(/(^|;)\s*[^;?]+($|;)/.test(l)){await sync();clearPers()}}};
/* ---- drawing helpers ---- */
const bad=v=>!isFinite(v)||Math.abs(v)>1e37;
const pfx=a=>a>=1e6?[1e6,'M']:a>=1e3?[1e3,'k']:a>=1||a===0?[1,'']:a>=1e-3?[1e-3,'m']:a>=1e-6?[1e-6,'µ']:[1e-9,'n'];
const eng=(v,u)=>{if(bad(v))return'–';const p=pfx(Math.abs(v));return(v/p[0]).toPrecision(4)+' '+p[1]+u};
const tick=(v,u)=>{const p=pfx(Math.abs(v));return +(v/p[0]).toPrecision(5)+' '+p[1]+u};
const db=v=>bad(v)?'–':v.toFixed(1)+' dB';
function nice(a,b,n){const r=(b-a)/n,e=10**Math.floor(Math.log10(r)),s=e*([1,2,5,10].find(k=>k*e>=r*.999)),o=[];for(let i=Math.ceil(a/s-1e-9);i<=b/s+1e-9;i++)o.push(i*s);return o}
function tiles(o){const m=$('meas'),k=Object.keys(o);if(m.childElementCount!==k.length)m.replaceChildren(...k.map(()=>{const d=document.createElement('div');d.append(document.createElement('b'),document.createElement('span'));return d}));k.forEach((x,i)=>{m.children[i].children[0].textContent=o[x];m.children[i].children[1].textContent=x})}
let CW=0,CH=0,R=1,fresh=false,queued=false;const pc=document.createElement('canvas'),pg=pc.getContext('2d'),wf=document.createElement('canvas'),wg=wf.getContext('2d');let wfKey='';
function clearPers(){pg.setTransform(1,0,0,1,0,0);pg.clearRect(0,0,pc.width,pc.height)}
function size(){R=devicePixelRatio||1;CW=cv.clientWidth;CH=cv.clientHeight;cv.width=pc.width=Math.max(1,CW*R);cv.height=pc.height=Math.max(1,CH*R)}
new ResizeObserver(()=>{size();render()}).observe($('scr'));
function render(){if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;draw()})}}
function axes(b,xr,yr,xt,yt,xf,yf,log){const X=v=>b.x+b.w*(log?Math.log(v/xr[0])/Math.log(xr[1]/xr[0]):(v-xr[0])/(xr[1]-xr[0])),Y=v=>b.y+b.h*(1-(v-yr[0])/(yr[1]-yr[0])),xi=p=>log?xr[0]*Math.pow(xr[1]/xr[0],(p-b.x)/b.w):xr[0]+(p-b.x)/b.w*(xr[1]-xr[0]),yi=p=>yr[0]+(1-(p-b.y)/b.h)*(yr[1]-yr[0]);
g.strokeStyle='#1d2726';g.fillStyle='#8d9a98';g.lineWidth=1;g.beginPath();xt.forEach(v=>{const p=X(v);g.moveTo(p,b.y);g.lineTo(p,b.y+b.h);if(xf){const s=xf(v),w=g.measureText(s).width;g.textAlign='left';g.fillText(s,Math.max(b.x,Math.min(b.x+b.w-w,p-w/2)),b.y+b.h+15)}});yt.forEach(v=>{const p=Y(v);g.moveTo(b.x,p);g.lineTo(b.x+b.w,p);g.textAlign='right';g.fillText(yf(v),b.x-7,p+4)});g.stroke();return{X,Y,xi,yi,b}}
function line(c,b,xs,ys,X,Y,col,w,glow,dash){c.save();c.beginPath();c.rect(b.x,b.y,b.w,b.h);c.clip();c.strokeStyle=col;c.lineWidth=w;c.lineJoin='round';c.setLineDash(dash||[]);if(glow){c.shadowColor=col;c.shadowBlur=glow}c.beginPath();for(let i=0;i<xs.length;i++){const x=X(xs[i]),y=Y(ys[i]);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.restore()}
function tag(s,x,y,col,al='left'){g.font='12px ui-monospace,monospace';const w=g.measureText(s).width+10;x=Math.max(2,Math.min(CW-w-2,al==='right'?x-w:al==='center'?x-w/2:x));y=Math.max(2,Math.min(CH-20,y));g.fillStyle='#050807e0';g.fillRect(x,y,w,18);g.fillStyle=col;g.textAlign='left';g.fillText(s,x+5,y+13);g.font='11px ui-monospace,monospace'}
const vl=(x,b,c,d)=>{g.strokeStyle=c;g.setLineDash(d||[]);g.beginPath();g.moveTo(x,b.y);g.lineTo(x,b.y+b.h);g.stroke();g.setLineDash([])},hl=(y,b,c,d)=>{g.strokeStyle=c;g.setLineDash(d||[]);g.beginPath();g.moveTo(b.x,y);g.lineTo(b.x+b.w,y);g.stroke();g.setLineDash([])};
